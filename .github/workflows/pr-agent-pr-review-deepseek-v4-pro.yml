name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr-agent-pr-review-deepseek-v4-pro:
    uses: segmentstream/segmentstream-agents/.github/workflows/pr-agent-pr-review-deepseek-v4-pro.yml@chore/universal-pr-review-agents-20260515
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
