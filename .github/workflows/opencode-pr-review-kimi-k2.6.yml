name: OpenCode

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  opencode-pr-review-kimi-k2-6:
    uses: segmentstream/segmentstream-agents/.github/workflows/opencode-pr-review-kimi-k2.6.yml@chore/universal-pr-review-agents-20260515
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
